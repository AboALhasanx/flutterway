name: Bug report
description: أبلغ عن خطأ في FlutterWay
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        شكراً لمساعدتك. لا ترفق معلومات شخصية أو كود مشروع كامل.
  - type: input
    id: version
    attributes:
      label: إصدار FlutterWay
      placeholder: مثال: 1.0.0
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: المرحلة
      placeholder: التجهيز / البناء / Hot Reload / أخرى
  - type: textarea
    id: steps
    attributes:
      label: خطوات إعادة المشكلة
      placeholder: |
        1. فتحت...
        2. ضغطت...
        3. ظهر...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: المتوقع
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: اللي صار فعلاً
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: التشخيص / السجل
      description: الصق التشخيص من زر «نسخ التشخيص» أو أرفق ملف ZIP.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: الخصوصية
      options:
        - label: راجعت البيانات ولا أرفقت معلومات شخصية.
          required: true
